build_and_push:
  stage: build

  image: moby/buildkit:latest

  only:
    refs:
      - main
    changes:
      - pi-docker/**
      - .gitlab-ci.yml

  variables:
    DOCKER_IMAGE: sullivanhart/pi-docker
    DOCKER_TAG_LATEST: latest
    DOCKER_TAG_COMMIT: $CI_COMMIT_SHORT_SHA

  before_script:
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"$DOCKER_USERNAME_PI\",\"password\":\"$DOCKER_PASS_PI\"}}}" > /root/.docker/config.json

  script:
    - buildctl build  --frontend dockerfile.v0 --local context=pi-docker  --local dockerfile=pi-docker  --output type=image,name=$DOCKER_IMAGE:$DOCKER_TAG_LATEST,push=true,name-canonical=true  --output type=image,name=$DOCKER_IMAGE:$DOCKER_TAG_COMMIT,push=true,name-canonical=true  --opt platform=linux/arm64
