image: ubuntu:24.04

stages:
  - build
  - test
  - push

# === CI for pi-docker ===
build-pi-docker:
  stage: build
  script:
    - echo "Building for pi-docker"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - pi-docker/**/*
        - .gitlab-ci.yml
    - when: never

test-pi-docker:
  stage: test
  script:
    - echo "Testing for pi-docker"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - pi-docker/**/*
        - .gitlab-ci.yml
    - when: never

push-pi-docker:
  stage: push
  script:
    - echo "Pushing for pi-docker"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - pi-docker/**/*
        - .gitlab-ci.yml
    - when: never
