default:
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_DRIVER: overlay2

stages:
  - check

check-dind:
  stage: check
  script:
    - echo "Environment variables:"
    - env | grep DOCKER
    - echo
    - echo "Docker certs:"
    - ls -la /certs/client || echo "Certs not found"
    - echo
    - echo "Docker version:"
    - docker version || echo "Docker version failed"
    - echo
    - echo "Docker info:"
    - docker info || echo "Docker info failed"
