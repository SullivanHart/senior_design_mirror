build_and_push:
  stage: build
  image: docker:24.0

  services:
    - name: docker:dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

  only:
    refs:
      - main
    changes:
      - pi-docker/**
      - .gitlab-ci.yml

  variables:
    DOCKER_IMAGE: sullivanhart/pi-docker
    DOCKER_TAG_LATEST: latest
    DOCKER_TAG_COMMIT: $CI_COMMIT_SHORT_SHA

  before_script:
    - until docker info; do sleep 1; done
    - echo "$DOCKER_PASS_PI" | docker login -u "$DOCKER_USERNAME_PI" --password-stdin

  script:
    - docker info
    - docker run --rm hello-world