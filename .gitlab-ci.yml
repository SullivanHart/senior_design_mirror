build_and_push:
  stage: build
  image: docker:24.0

  services:
    - name: docker:dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

  only:
    refs:
      - main
    changes:
      - pi-docker/**
      - .gitlab-ci.yml

  variables:
    DOCKER_IMAGE: sullivanhart/pi-docker
    DOCKER_TAG_LATEST: latest
    DOCKER_TAG_COMMIT: $CI_COMMIT_SHORT_SHA

  before_script:
    - until docker info; do sleep 1; done
    - echo "$DOCKER_PASS_PI" | docker login -u "$DOCKER_USERNAME_PI" --password-stdin

  test_docker_access:
    script:
      - docker info
      - docker run --rm hello-world

  script:
    - docker buildx create --use --driver docker-container --name builder
    - docker buildx inspect --bootstrap
    - docker buildx build \
        --platform linux/arm64 \
        -t $DOCKER_IMAGE:$DOCKER_TAG_LATEST \
        -t $DOCKER_IMAGE:$DOCKER_TAG_COMMIT \
        --push \
        ./pi-docker