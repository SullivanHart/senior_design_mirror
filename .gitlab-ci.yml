default:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

stages:
  - debug
  - build

before_script:
  - echo "$DOCKER_PASS_PI" | docker login -u "$DOCKER_USERNAME_PI" --password-stdin
  - docker buildx create --use
  - docker buildx inspect --bootstrap

debug:
  stage: debug
  script:
    - echo "Docker environment details:"
    - docker version
    - docker info
    - docker buildx version
    - docker buildx ls

build:
  stage: build
  script:
    - echo "Building and pushing image for arm64:"
    - docker buildx build --platform linux/arm64 -t sullivanhart/pi-docker:latest --push .
