build_and_push:
  stage: build
  only:
    refs:
      - main
    changes:
      - pi-docker/**

  image: docker:latest
  services:
    - docker:dind

  variables:
    DOCKER_IMAGE: sullivanhart/pi-docker
    DOCKER_TAG: latest

  before_script:
    - apk add --no-cache curl jq
    - echo "$DOCKER_PASS_PI" | docker login -u "$DOCKER_USERNAME_PI" --password-stdin

  script:
    - docker buildx create --use || true
    - docker buildx inspect --bootstrap
    - docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 \
      -t $DOCKER_IMAGE:$DOCKER_TAG \
      --push pi-docker
