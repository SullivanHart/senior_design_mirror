default:
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_DRIVER: overlay2

stages:
  - check

check-dind:
  stage: check
  script:
    - echo "Checking Docker access..."
    - for i in {1..10}; do
      docker info && break || (echo "Waiting for Docker... ($i)" && sleep 3);
      done
