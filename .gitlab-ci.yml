image: docker:24.0.2

services:
  - docker:24.0.2-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "" # disables TLS inside DinD so it works smoothly

stages:
  - build

before_script:
  - echo "$DOCKER_PASS_PI" | docker login -u "$DOCKER_USERNAME_PI" --password-stdin
  - docker buildx create --use
  - docker buildx inspect --bootstrap

build-job:
  stage: build
  script:
    - docker buildx build --platform linux/arm64 -t sullivanhart/pi-docker:latest --push .
